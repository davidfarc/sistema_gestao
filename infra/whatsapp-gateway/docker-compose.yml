# Gateway do WhatsApp (SPEC-FASE2 §C): Evolution API + banco + cache + túnel.
# Roda num computador da escola que fica sempre ligado (Docker Desktop).
#
# - Nada fica aberto na rede da escola: a Evolution só escuta no próprio
#   computador (127.0.0.1) e o sistema chega até ela pelo túnel do Cloudflare.
# - Senhas e chaves ficam no arquivo `.env` desta pasta (NUNCA no repositório;
#   copie o `env.exemplo` para `.env` e preencha).
# - Versões TRAVADAS (nada de "latest"): em 23/11/2026 a Evolution 2.3.8 e o
#   cloudflared 2026.11.2 saíram e o envio pelo túnel passou a ser recusado
#   (HTTP 400 sem corpo). Para atualizar, troque a versão aqui, rode
#   `docker compose up -d` e teste uma resposta do agente antes de seguir.
# - `restart: unless-stopped`: volta sozinho depois de queda de luz, desde que o
#   Docker Desktop esteja configurado para abrir junto com o Windows.

services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on: [postgres, redis]
    # Porta só deste computador, para abrir o painel (http://localhost:PORTA/manager).
    # O túnel não usa esta porta: ele fala com evolution:8080 por dentro do Docker.
    # Se a 8080 já estiver em uso por outro sistema, defina EVOLUTION_LOCAL_PORT no .env.
    ports:
      - "127.0.0.1:${EVOLUTION_LOCAL_PORT:-8080}:8080"
    environment:
      SERVER_URL: ${SERVER_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: ecco
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      # Só conversas individuais interessam ao agente.
      LOG_LEVEL: ERROR,WARN,INFO
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  # Túnel do Cloudflare: liga um endereço público (definido no painel do
  # Cloudflare) a http://evolution:8080, sem abrir porta no roteador da escola.
  tunnel:
    image: cloudflare/cloudflared:2026.11.1
    restart: unless-stopped
    depends_on: [evolution]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
